name: EMA Windows Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ema-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Portable desktop logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s desktop/windows/tests -v
      - run: python -m compileall -q desktop/windows/ema_windows desktop/windows/tools
  windows:
    name: Windows x64 portable build
    runs-on: windows-latest
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install desktop dependencies and packager
        run: python -m pip install -r desktop/windows/requirements.txt pyinstaller==6.11.1
      - name: Windows logic tests
        run: python -m unittest discover -s desktop/windows/tests -v
      - name: Build complete app and run packaged runtime smoke tests
        shell: pwsh
        run: ./desktop/windows/build.ps1
      - name: Upload portable Windows app
        uses: actions/upload-artifact@v4
        with:
          name: EMA-Windows-x64
          path: desktop/windows/dist/EMA/
          if-no-files-found: error
          retention-days: 14
