name: EMA Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ema-android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Compile Kotlin
        id: compile
        run: |
          set -o pipefail
          gradle :app:compileDebugKotlin             --no-daemon             --console=plain             --stacktrace             --info 2>&1 | tee build-log.txt

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          gradle :app:assembleDebug             --no-daemon             --console=plain             --stacktrace             --info 2>&1 | tee -a build-log.txt

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ema-build-diagnostics
          path: build-log.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ema-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
