name: EMA Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ema-android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Set monotonic Android version
        id: version
        run: |
          set -euo pipefail
          version_code="$(date +%s)"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "version_name=0.9.$version_code" >> "$GITHUB_OUTPUT"

      - name: Compile Kotlin
        id: compile
        env:
          EMA_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          EMA_VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -o pipefail
          gradle :app:compileDebugKotlin --no-daemon --console=plain --stacktrace --info 2>&1 | tee build-log.txt

      - name: Build debug and release APKs
        id: build
        env:
          EMA_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          EMA_VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --console=plain --stacktrace --info 2>&1 | tee -a build-log.txt

      - name: Set APK paths
        run: |
          echo "RELEASE_APK=app/build/outputs/apk/release/app-release-unsigned.apk" >> "$GITHUB_ENV"
          echo "DEBUG_APK=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"

      - name: Verify APK outputs
        run: |
          test -s "$RELEASE_APK"
          test -s "$DEBUG_APK"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ema-build-diagnostics
          path: build-log.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ema-debug-apk
          path: ${{ env.DEBUG_APK }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest release to AEM Store
        if: success()
        env:
          APK: ${{ env.RELEASE_APK }}
        run: |
          set -euo pipefail
          APKSIGNER="$(find "${ANDROID_HOME:-/opt/android-sdk}" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          signing_cert=""
          AAPT="$(find "${ANDROID_HOME:-/opt/android-sdk}" -type f -name aapt | sort -V | tail -n 1)"
          badging="$("$AAPT" dump badging "$APK" | head -n 1)"
          package="$(sed -n "s/.*package: name='\\([^']*\\)'.*/\\1/p" <<<"$badging")"
          version_code="$(sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p" <<<"$badging")"
          version_name="$(sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p" <<<"$badging")"
          app_name="$(sed -n "s/.*application-label='\\([^']*\\)'.*/\\1/p" <<<"$badging")"
          size_bytes="$(stat -c '%s' "$APK")"
          sha256="$(sha256sum "$APK" | awk '{print $1}')"
          source_release_id="github-actions-${{ github.run_id }}"
          meta="$(jq -n --arg action prepare --arg repo "Emmanuel001afk/EMA" --argjson run_id "${{ github.run_id }}" --arg filename "app-release.apk" --arg application_name "$app_name" --arg version_name "$version_name" --argjson version_code "$version_code" --arg channel stable --arg package_identity "$package" --arg title "EMA Digital Assistant APK" --arg source_release_id "$source_release_id" --arg signing_certificate_sha256 "$signing_cert" '{action:$action,repo:$repo,run_id:$run_id,filename:$filename,application_name:$application_name,version_name:$version_name,version_code:$version_code,channel:$channel,package_identity:$package_identity,title:$title,source_release_id:$source_release_id,signing_certificate_sha256:$signing_certificate_sha256}')"
          prepare="$(curl --fail-with-body -sS -X POST "https://wfvvmyixqcwosmuldxoq.supabase.co/functions/v1/aem-publish-github-artifact" -H "Content-Type: application/json" -H "x-github-token: ${{ github.token }}" --data "$meta")"
          upload_token="$(jq -er '.token' <<<"$prepare")"
          object_path="$(jq -er '.path // .Key' <<<"$prepare")"

          # APKs over a few MB use Supabase's signed resumable/TUS endpoint.
          # The signed route is the Storage route intended for createSignedUploadUrl
          # tokens; use the token returned by the SDK/function directly.
          project_storage="https://wfvvmyixqcwosmuldxoq.storage.supabase.co"
          upload_endpoint="$project_storage/storage/v1/upload/resumable/sign/$object_path"
          tus_headers="$(mktemp)"
          tus_body="$(mktemp)"
          metadata="bucketName $(printf '%s' 'aem-artifacts' | base64 -w0),objectName $(printf '%s' "$object_path" | base64 -w0),contentType $(printf '%s' 'application/vnd.android.package-archive' | base64 -w0)"
          upload_http="$(curl -sS -D "$tus_headers" -o "$tus_body" -w '%{http_code}' -X POST "$upload_endpoint?token=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$upload_token")"             -H "Tus-Resumable: 1.0.0"             -H "Upload-Length: $size_bytes"             -H "Upload-Metadata: $metadata"             -H "x-upsert: true")"
          if [[ "$upload_http" != "201" ]]; then
            echo "AEM resumable upload initialization failed with HTTP $upload_http" >&2
            cat "$tus_body" >&2 || true
            exit 1
          fi
          resumable_url="$(awk 'BEGIN{IGNORECASE=1} /^Location:/ {sub(/^Location:[[:space:]]*/, ""); gsub("\r",""); print; exit}' "$tus_headers")"
          test -n "$resumable_url"
          chunk_size=$((6 * 1024 * 1024))
          offset=0
          while (( offset < size_bytes )); do
            remaining=$((size_bytes - offset))
            current_chunk=$chunk_size
            if (( remaining < current_chunk )); then current_chunk=$remaining; fi
            curl --fail-with-body -sS -X PATCH "$resumable_url"               -H "Tus-Resumable: 1.0.0"               -H "Content-Type: application/offset+octet-stream"               -H "Upload-Offset: $offset"               --data-binary "@<(tail -c +$((offset + 1)) "$APK" | head -c "$current_chunk")"
            offset=$((offset + current_chunk))
            echo "Uploaded $offset / $size_bytes bytes"
          done
          rm -f "$tus_headers" "$tus_body"

          finalize="$(jq -n --arg action finalize --arg repo "Emmanuel001afk/EMA" --argjson run_id "${{ github.run_id }}" --arg filename "app-release.apk" --arg application_name "$app_name" --arg version_name "$version_name" --argjson version_code "$version_code" --arg channel stable --arg package_identity "$package" --arg title "EMA Digital Assistant APK" --arg source_release_id "$source_release_id" --arg signing_certificate_sha256 "$signing_cert" --arg object_path "$object_path" --arg path "$object_path" --argjson size_bytes "$size_bytes" --arg sha256 "$sha256" '{action:$action,repo:$repo,run_id:$run_id,filename:$filename,application_name:$application_name,version_name:$version_name,version_code:$version_code,channel:$channel,package_identity:$package_identity,title:$title,source_release_id:$source_release_id,signing_certificate_sha256:$signing_certificate_sha256,object_path:$object_path,path:$object_path,size_bytes:$size_bytes,sha256:$sha256}')"
          finalize_http="$(curl -sS -o finalize-response.json -w '%{http_code}' -X POST "https://wfvvmyixqcwosmuldxoq.supabase.co/functions/v1/aem-publish-github-artifact" -H "Content-Type: application/json" -H "x-github-token: ${{ github.token }}" --data "$finalize")"
          cat finalize-response.json
          case "$finalize_http" in
            2*) ;;
            *) echo "AEM finalize failed with HTTP $finalize_http" >&2; exit 1 ;;
          esac
