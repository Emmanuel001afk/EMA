name: EMA Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ema-android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Attach verified APKs directly to the GitHub rolling release.
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Set monotonic Android version
        id: version
        run: |
          set -euo pipefail
          version_code="$(date +%s)"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "version_name=0.9.$version_code" >> "$GITHUB_OUTPUT"

      - name: Compile Kotlin
        id: compile
        env:
          EMA_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          EMA_VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -o pipefail
          if ! gradle :app:compileDebugKotlin --no-daemon --console=plain --stacktrace --info 2>&1 | tee build-log.txt; then
            python3 tools/report_gradle_failure.py build-log.txt
            exit 1
          fi

      - name: Run unit tests
        id: test
        env:
          EMA_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          EMA_VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -o pipefail
          if ! gradle :app:testDebugUnitTest --no-daemon --console=plain --stacktrace 2>&1 | tee -a build-log.txt; then
            python3 tools/report_gradle_failure.py build-log.txt
            exit 1
          fi

      # Diagnostics only: an artifact-storage problem must never block the build.
      # continue-on-error keeps the job green so the APK steps below still run.
      - name: Upload unit test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ema-unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 7

      - name: Build debug and release APKs
        id: build
        env:
          EMA_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          EMA_VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -o pipefail
          if ! gradle :app:assembleDebug :app:assembleRelease --no-daemon --console=plain --stacktrace --info 2>&1 | tee -a build-log.txt; then
            python3 tools/report_gradle_failure.py build-log.txt
            exit 1
          fi

      - name: Set APK paths
        run: |
          echo "RELEASE_APK=app/build/outputs/apk/release/app-release-unsigned.apk" >> "$GITHUB_ENV"
          echo "DEBUG_APK=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"

      - name: Sign release APK when a persistent release key is configured
        if: github.event_name != 'pull_request'
        env:
          EMA_SIGNING_KEYSTORE_BASE64: ${{ secrets.EMA_SIGNING_KEYSTORE_BASE64 }}
          EMA_SIGNING_STORE_PASSWORD: ${{ secrets.EMA_SIGNING_STORE_PASSWORD }}
          EMA_SIGNING_KEY_ALIAS: ${{ secrets.EMA_SIGNING_KEY_ALIAS }}
          EMA_SIGNING_KEY_PASSWORD: ${{ secrets.EMA_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$EMA_SIGNING_KEYSTORE_BASE64$EMA_SIGNING_STORE_PASSWORD$EMA_SIGNING_KEY_ALIAS$EMA_SIGNING_KEY_PASSWORD" ]]; then
            echo '::notice::No release signing key configured; no installable release APK will be published.'
            exit 0
          fi
          build_tools="$(dirname "$(find "${ANDROID_HOME:-/opt/android-sdk}/build-tools" -type f -name apksigner | sort -V | tail -n 1)")"
          signed_apk="app/build/outputs/apk/release/app-release-signed.apk"
          bash tools/sign_release_apk.sh "$RELEASE_APK" "$signed_apk" "$build_tools"
          echo "SIGNED_RELEASE_APK=$signed_apk" >> "$GITHUB_ENV"

      - name: Test release signing with a disposable CI key
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          keytool -genkeypair -noprompt -keystore "$temp_dir/test.p12" -storetype PKCS12 \
            -storepass ci-test-password -keypass ci-test-password -alias ci-test \
            -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=EMA CI Test Only'
          export EMA_SIGNING_KEYSTORE_BASE64="$(base64 -w 0 "$temp_dir/test.p12")"
          export EMA_SIGNING_STORE_PASSWORD=ci-test-password EMA_SIGNING_KEY_PASSWORD=ci-test-password EMA_SIGNING_KEY_ALIAS=ci-test
          build_tools="$(dirname "$(find "${ANDROID_HOME:-/opt/android-sdk}/build-tools" -type f -name apksigner | sort -V | tail -n 1)")"
          bash tools/sign_release_apk.sh "$RELEASE_APK" "$temp_dir/test-signed.apk" "$build_tools"
          # The disposable test APK and key are deleted and never published.

      - name: Test built-in wake model packaging verifier
        run: python3 -m unittest discover -s tests -v

      - name: Verify APK outputs
        run: |
          test -s "$RELEASE_APK"
          test -s "$DEBUG_APK"
          python3 tools/verify_bundled_wake_model.py "$DEBUG_APK" "$RELEASE_APK"
          APKSIGNER="$(find "${ANDROID_HOME:-/opt/android-sdk}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$DEBUG_APK"
          if [[ -n "${SIGNED_RELEASE_APK:-}" ]]; then
            "$APKSIGNER" verify --verbose --print-certs "$SIGNED_RELEASE_APK"
          fi

      - name: Upload build diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ema-build-diagnostics
          path: build-log.txt
          if-no-files-found: warn
          retention-days: 7

      # Artifact storage is optional; the GitHub rolling release is the distribution channel.
      - name: Upload debug APK
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ema-debug-apk
          path: ${{ env.DEBUG_APK }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release APK
        if: success() && env.SIGNED_RELEASE_APK != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ema-release-signed-apk
          path: ${{ env.SIGNED_RELEASE_APK }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish APKs to the rolling release
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="apk-latest"
          notes="Latest EMA build from commit ${GITHUB_SHA::7} on ${{ github.ref_name }}.

          Install ema-release-signed.apk when present. It is signed with the configured release key.
          ema-debug.apk is debug-signed for testing only; signatures may change between CI builds.
          Unsigned build outputs are not distributed here.

          Download directly from this GitHub release; no app store is required."

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes "$notes"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "EMA APK (latest build)" \
              --notes "$notes"
          fi

          cp "$DEBUG_APK" ema-debug.apk
          gh release upload "$tag" ema-debug.apk --repo "$GITHUB_REPOSITORY" --clobber
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq 'app-release-unsigned.apk'; then
            gh release delete-asset "$tag" app-release-unsigned.apk --repo "$GITHUB_REPOSITORY" --yes
          fi
          if [[ -n "${SIGNED_RELEASE_APK:-}" ]]; then
            cp "$SIGNED_RELEASE_APK" ema-release-signed.apk
            gh release upload "$tag" ema-release-signed.apk --repo "$GITHUB_REPOSITORY" --clobber
          elif gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq 'ema-release-signed.apk'; then
            # Do not label an old signed asset as the current build.
            gh release delete-asset "$tag" ema-release-signed.apk --repo "$GITHUB_REPOSITORY" --yes
          fi
          echo "::notice::APKs published to https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
